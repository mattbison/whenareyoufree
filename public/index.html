<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#16A6C9">
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0C6880">
	<meta name="description" content="Add your free times. See when everyone can meet.">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<meta name="apple-mobile-web-app-title" content="When Free?">
	<link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">

	<!-- Link previews in group chats (iMessage, WhatsApp, Slack, etc.) -->
	<meta property="og:type" content="website">
	<meta property="og:site_name" content="When Are You Free?">
	<meta property="og:title" content="When Are You Free?">
	<meta property="og:description" content="Add your free times. See when everyone can meet.">
	<meta property="og:image" content="https://whenareyoufree.netlify.app/og-image.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">

	<!-- Apply the saved/system theme before first paint so dark mode doesn't flash. -->
	<script>
		(function () {
			try {
				var pref = localStorage.getItem("wayf_theme") || "system";
				var dark = pref === "dark" ||
					(pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
			} catch (e) {}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	<title>When Are You Free?</title>
</head>

<body>
	<noscript>
		You need to enable JavaScript to run this app.
	</noscript>
	<div id="root"></div>
</body>

</html>
